[project]
name = "pymedphys"
version = "0.43.0"
description = "Medical Physics library"
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "PyMedPhys Contributors", email = "developers@pymedphys.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
]

# CHANGED: Removed "setuptools" from core deps.
# - setuptools was only needed for pkg_resources; migrate to importlib.metadata/importlib.resources.
# - If you still need setuptools at runtime, add it back with a comment explaining where.
# CHANGED: Kept "tomlkit" as it's used by propagate and config.
# CHANGED: "typing-extensions" retained for backwards compat with Py3.10.
dependencies = [
  "typing-extensions",
  # SECURITY: tomlkit >=0.15.1 (bundled advisory fix; also the version
  # Dependabot PR #17 bumps to).
  "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://pymedphys.com"
Repository = "https://github.com/pymedphys/pymedphys"
Documentation = "https://docs.pymedphys.com"

[project.scripts]
pymedphys = "pymedphys.__main__:main"

[project.optional-dependencies]
user = [
  # --- Image processing ---
  # SECURITY: Pillow >=12.3.0 (2026-07-01 quarterly security release).
  #   Fixes the July 2026 advisory batch: CVE-2026-59204 (JPEG2000 tiled
  #   decode memory exhaustion), CVE-2026-59205 (ImageCmsTransform.apply
  #   heap corruption), CVE-2026-54058 (McIdas AREA mmap row-stride OOB
  #   read), CVE-2026-54059 (PcfFontFile bomb-check bypass), plus TGA RLE
  #   OOB read, RankFilter OOB write, GdImageFile/BdfFontFile/FontFile
  #   decompression-bomb bypasses, PdfStream.decode() bomb, EpsImagePlugin
  #   infinite loop, and WindowsViewer.get_command() command injection
  #   (now uses os.startfile()).
  # BREAKING: Pillow 11.0 dropped Python 3.8 (fine, we require 3.10+).
  #   Pillow 12.0 removed Image.ANTIALIAS (use Image.LANCZOS instead).
  #   Pillow 12.3.0 removed non-image ImageCms modes.
  #   VERIFIED: this codebase only calls Image.open() (narrow_png.py,
  #   paulking/profile.py) — no ANTIALIAS/ImageCms usage, so no code change.
  "Pillow>=12.3.0",

  "PyYAML",
  "anthropic",
  "anyio",
  "attrs",

  # --- Web framework (dash) ---
  # Dash 3.x is current. Werkzeug CVEs are resolved at >=3.1.0 (transitive).
  "dash>=3.0",

  "dbfread",
  "dicompyler-core",
  "imageio[tifffile]",
  "keyring",
  "matplotlib",
  "natsort",
  "numba",
  "numpy>=1.26",
  "packaging",
  "pandas>=1.0.0",
  "plotly",

  # SECURITY: pydicom 3.0.1 -> >=3.0.2 (CVE-2026-32711: path traversal via DICOMDIR)
  # BREAKING: pydicom 3.0 changed JPEGLossless UID value and default encoding behaviour.
  #   Already on 3.0.x so 3.0.2 is a safe patch bump.
  "pydicom>=3.0.2",

  "pylibjpeg-libjpeg>=1.3.2",
  "pymssql",

  # pynetdicom 3.0 aligns with pydicom 3.0
  "pynetdicom>=3.0",

  # REMOVED: python-dateutil
  # Per CHANGELOG v0.38.0: "dateutil dependency was removed for compatibility
  # reasons with Streamlit's cache. Replaced with pandas equivalents."
  # If any code still imports dateutil, it's a bug to fix, not a dep to keep.

  "pywin32; sys_platform == 'win32' and python_version >= '3.10' and python_version < '3.13'",
  "requests>=2.32.0",
  "scikit-learn",
  "scipy",
  "shapely>=1.7.0",
  "sqlalchemy>=2.0",

  # SECURITY: Streamlit 1.34.0 -> >=1.44.0
  # Fixes: SSRF on Windows (NTLM), path traversal on Windows, and pulls in
  #   patched Tornado >=6.5.5 and Werkzeug >=3.1.0 transitively.
  # BREAKING CHANGES from 1.34 -> 1.44:
  #   1. st.cache -> REMOVED (deprecated since 1.16). Must migrate to:
  #      - @st.cache_data for data-returning functions
  #      - @st.cache_resource for connections/models/global resources
  #      Search codebase: grep -rn "@st.cache\b" lib/pymedphys/
  #   2. st.experimental_dialog -> st.dialog (renamed in 1.37)
  #   3. st.write no longer sets unsafe_allow_html=True for _repr_html_ objects (1.36)
  #   4. Pydantic <2.0 custom validator patch removed (1.41)
  #   5. Experimental cache replay removed from caching decorators (1.41)
  #   6. st._is_running_with_streamlit (private API used in _gui.py) - verify still works
  #   7. st.bokeh_chart removed (1.52) - check if used anywhere
  #   8. SECURITY (>=1.60.0): required so the resolver can take patched
  #      starlette (>=1.3.1) and python-multipart (>=0.0.32), which are
  #      pulled in transitively by Streamlit and carry the Host-header
  #      poisoning, UNC SSRF/NTLM, form-limit DoS and parameter-smuggling
  #      advisories.
  #      VERIFIED: no st.cache / st.experimental_dialog / st.bokeh_chart /
  #      st._is_running_with_streamlit usage anywhere in lib/ — the 1.44
  #      migration already removed them, so 1.60 needs no code change.
  # Pin upper bound <2.0 to avoid future major breaks.
  "streamlit>=1.60.0,<2.0",

  "timeago",

  # CHANGED: Consider replacing "toml" with tomllib (stdlib 3.11+) + tomlkit.
  # For now keeping it since some code may still import toml directly.
  "toml",

  "tqdm",
  "trio",
  "trio-asyncio",
  "watchdog",
  "xmltodict",
]

dev = [
  "doc8",
  "pre-commit",
  "pyright",
  "readme-renderer",
  "rope",
  "ruff",
  "tabulate",
]

lint = [
  "astroid",
  "pylint",
  "ruff",
]

tests = [
  "anthropic",
  "astroid",
  "imageio",
  "matplotlib",
  "numba",
  "pandas>=1.0.0",
  "Pillow",
  "psutil",
  "pydicom>=3.0.2",
  "pynetdicom>=3.0",
  "PyGithub",
  "pylibjpeg-libjpeg>=1.3.2",
  "pylint",
  # SECURITY: pytest tmpdir vulnerability fixed in >=8.4.0
  "pytest>=8.4.0",
  "pytest-rerunfailures",
  "pytest-sugar",
  # REMOVED: python-dateutil (see note in [user])
  "shapely",
  "tqdm",
]

docs = [
  "ipython>=7.31.1",
  # NOTE: Dependabot PR #8 proposes jupyter-book 2.x — deliberately NOT taken.
  #   Jupyter Book 2 is a ground-up rewrite on the MyST-MD (Node) engine with
  #   a different config format (_config.yml + _toc.yml -> myst.yml), a
  #   different CLI and a different extension model; it would break the whole
  #   docs build and is NOT a security fix.  The advisories reaching us
  #   through this tree (docutils, markdown-it-py) are pinned directly in
  #   [tool.uv] constraint-dependencies instead, so we get the fixes while
  #   staying on the 1.x engine.  Revisit as a planned docs migration.
  "jupyter-book>=1.0.4.post1,<3.0.0",
  "matplotlib",
  "networkx",
  "numba",
  "numpy",
  "Pillow>=12.3.0",          # prevents old Pillow resolving via matplotlib
  "pydicom>=3.0.2",
  "scipy",
  "sphinx-argparse",
  "sphinx-book-theme",
  "toml",
  # SECURITY: tornado >=6.5.8 — gzip-bomb decompression without size limit,
  # Authorization header forwarded across cross-origin redirects,
  # CurlAsyncHTTPClient per-request credential leak on handle reuse, OOB
  # memory access in the C extension, and (6.5.8) unbounded
  # application/x-www-form-urlencoded field parsing that stalls the event
  # loop (CVE-2026-82397).  Pulled in via ipykernel/jupyter.
  "tornado>=6.5.8",
  "tqdm",
  "urllib3>=2.7.0",           # prevents old urllib3 via requests/sphinx
  "wheel>=0.45.2",            # path traversal fix
]

doctests = [
  "pytest>=8.4.0",
  "ruff",
  "sphinx-book-theme",
  "tabulate",
  "toml"
]

# comparables = [
#     "flashgamma",
# ]

cli = [
    "toml",
]

dicom = [
    "pydicom>=3.0.2",
    "pynetdicom>=3.0",
]

icom = [
    "numpy>=1.26",
]

mosaiq = [
    "attrs",
    "pandas>=1.0.0",
    "pymssql",
    "scikit-learn",
    "sqlalchemy>=2.0",
    "toml",
]

propagate = [
    "ruff",
]

# NOTE: [all] should be the union of every extra above.
# Consider generating this programmatically via propagate_extras() to prevent drift.
all = [
    "Pillow>=12.3.0",
    "PyYAML",
    "anthropic",
    "anyio",
    "astroid",
    "attrs",
    "dash>=3.0",
    "dbfread",
    "dicompyler-core",
    "doc8",
    "imageio[tifffile]",
    "ipython>=7.31.1",
    "jupyter-book>=1.0.4.post1,<3.0.0",
    "keyring",
    "matplotlib",
    "natsort",
    "networkx",
    "numba",
    "numpy>=1.26",
    "packaging",
    "pandas>=1.0.0",
    "plotly",
    "pre-commit",
    "psutil",
    "pydicom>=3.0.2",
    "PyGithub",
    "pylibjpeg-libjpeg>=1.3.2",
    "pylint",
    "pymssql",
    "pynetdicom>=3.0",
    "pyright",
    "pytest>=8.4.0",
    "pytest-rerunfailures",
    "pytest-sugar",
    "pywin32; sys_platform == 'win32' and python_version >= '3.10' and python_version < '3.13'",
    "readme-renderer",
    "requests>=2.32.0",
    "rope",
    "ruff",
    "scikit-learn",
    "scipy",
    "shapely>=1.7.0",
    "sphinx-argparse",
    "sphinx-book-theme",
    "sqlalchemy>=2.0",
    "streamlit>=1.60.0,<2.0",
    "tabulate",
    "timeago",
    "toml",
    "tqdm",
    "trio",
    "trio-asyncio",
    "watchdog",
    "xmltodict",
]

[tool.pymedphys.extra-groups]
dev   = ["tests", "docs", "cli", "propagate"]
docs  = ["docs"]
user  = ["user"]
full  = ["user", "tests", "docs", "doctests", "cli", "dicom", "icom", "mosaiq"]

[dependency-groups]
dev = [
  "sphinx-external-toc>=1.0.1",
]

# ─────────────────────────────────────────────────────────────────────────────
# Transitive security floors.
#
# These packages are NOT direct dependencies of pymedphys — they arrive via
# streamlit, pygithub, beautifulsoup4, sphinx and the jupyter stack.  Listing
# them as constraints raises the floor during resolution WITHOUT adding them
# to the public dependency surface (so `pip install pymedphys` does not start
# advertising starlette et al. as pymedphys requirements).
#
# Each entry exists to close a specific advisory; remove an entry only once
# the parent package's own floor has moved past it.
[tool.uv]
constraint-dependencies = [
  # via streamlit — Host header validation bypass poisoning request.url.path,
  # SSRF + NTLM credential theft via UNC paths in StaticFiles on Windows,
  # request.form() limits silently ignored (DoS), arbitrary HTTP method
  # dispatched to HTTPEndpoint via getattr, unvalidated path concatenated
  # into authority poisoning request.url.hostname.
  "starlette>=1.3.1",

  # via streamlit — quadratic-time querystring parsing with semicolon
  # separators (CPU DoS), negative Content-Length buffering the whole body,
  # Content-Disposition parameter smuggling (RFC 2231/5987), semicolon
  # treated as querystring field separator.
  "python-multipart>=0.0.32",

  # via pygithub — public-key JWK accepted as HMAC secret (forged HS256
  # tokens), algorithm allow-list bypass with PyJWK/PyJWKClient keys,
  # unauthenticated DoS via unbounded Base64URL decoding in detached JWS,
  # PyJWKClient missing scheme allowlist (CVE-2024-21643-class SSRF) and
  # unbounded JWKS endpoint requests via attacker-controlled kid values.
  "pyjwt>=2.13.0",

  # via beautifulsoup4 — memory exhaustion from large comma-separated
  # selector lists, and ReDoS in the selector parser.
  "soupsieve>=2.9.1",

  # via pyjwt / secretstorage — vulnerable OpenSSL bundled in the
  # cryptography wheels.
  "cryptography>=49.0.0",

  # via ipykernel / jupyter-client / streamlit — see the tornado note in
  # the [docs] extra above.
  "tornado>=6.5.8",

  # via streamlit — GitPython <3.1.58/3.1.59/3.1.60/3.1.61 chain of
  # advisories: config-injection RCE via unsafe re-serialization of
  # multi-line git-config values (CVE-2026-78676), arbitrary file read via
  # TagReference.create (CVE-2026-78679) and Repo.blame (CVE-2026-78678),
  # arbitrary file overwrite via IndexFile.from_tree/reset/merge_tree
  # (CVE-2026-76219), command execution via split_single_char_options
  # bypass of the unsafe-options guard (CVE-2026-76220), and config-name
  # injection via unvalidated option names (CVE-2026-76221), plus further
  # fixes in 3.1.60/3.1.61. Pinned to the latest release since GitPython
  # has shipped a security fix in nearly every recent patch release.
  "gitpython>=3.1.62",

  # via matplotlib / imageio / streamlit — see the Pillow note in [user].
  "Pillow>=12.3.0",

  # NOTE: docutils >=0.22.4 (Dependabot PR #14) is deliberately NOT
  #   constrained here, for the same reason as markdown-it-py below:
  #   jupyter-book 1.0.4.post1 requires docutils >=0.18,<0.22, so the bump is
  #   unsatisfiable until the Jupyter Book 2 migration.  It is a feature/
  #   maintenance bump rather than a security fix, so nothing is exposed by
  #   deferring it.
  #
  #   Dependabot PR #25 (docutils 0.22.4 -> 0.23) is the same wall, one step
  #   further out: myst-parser~=3.0 (pulled in by jupyter-book) requires
  #   docutils>=0.18,<0.22, so 0.23 is unsatisfiable for the same reason as
  #   the paragraph above. Re-check both together at the Jupyter Book 2
  #   migration rather than one at a time.

  # NOTE: sphinx >=8.1.3 (Dependabot PR #20, sphinx 7.4.7 -> 8.1.3) is
  #   deliberately NOT constrained here. sphinx is not a direct dependency;
  #   it arrives via jupyter-book, and jupyter-book 1.0.4.post1 requires
  #   sphinx~=7.0 (i.e. >=7.0,<8.0) — confirmed from the published wheel
  #   metadata. Sphinx 8 is a major version and forcing it here would make
  #   the [docs] extra unresolvable, not just risky. Feature/maintenance
  #   bump, not a security fix. Revisit at the Jupyter Book 2 migration
  #   noted in [docs], same as the docutils/markdown-it-py notes above.

  # NOTE: pyarrow >=25.0.0 (Dependabot PR #24, pyarrow 24.0.0 -> 25.0.0) is
  #   deliberately NOT constrained here. pyarrow is not a direct dependency;
  #   the only consumer in the graph is streamlit, and streamlit 1.60.0
  #   requires pyarrow<25,>=7.0 — a hard ceiling, confirmed from the
  #   published wheel metadata. Adding a >=25 floor here would make the
  #   [user] extra unresolvable. Revisit once streamlit raises its own
  #   ceiling past pyarrow 25.

  # NOTE: pydantic-core >=2.47.0 (Dependabot PR #23) is deliberately NOT
  #   constrained here. pydantic-core is not a direct dependency — it is
  #   pydantic's compiled backend, and pydantic pins it with an *exact*
  #   version match (pydantic 2.13.4 requires pydantic-core==2.46.4; even
  #   the latest pydantic 2.13.5 only requires ==2.46.5). No published
  #   pydantic release currently requires pydantic-core==2.47.0. Tested:
  #   forcing this floor does not fail cleanly — the resolver instead falls
  #   back all the way to pydantic 1.10.26 (a different major API with no
  #   pydantic-core dependency at all), which is a silent correctness trap,
  #   not a resolution error you'd notice in a routine dependency-bump
  #   review. Do not add this constraint until a pydantic 2.x release
  #   actually depends on pydantic-core 2.47.0 or later.

  # NOTE: markdown-it-py >=4.0.0 (Dependabot PR #13) is deliberately NOT
  #   constrained here.  It is a feature bump, not a security fix, and it is
  #   *unsatisfiable* on Jupyter Book 1.x: jupyter-book 1.0.4.post1 requires
  #   myst-parser >=3.0,<4, which pins markdown-it-py >=3.0,<4.  3.0.0 is the
  #   only 3.x release, so there is nothing to move to.  This bump can only
  #   land together with the Jupyter Book 2 migration noted in [docs].

  # via requests / pygithub (Dependabot PR #15).
  "urllib3>=2.7.0",
]

[tool.hatch.build]
include = ["lib/pymedphys/docs/_build/html/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["lib/pymedphys"]

[tool.ruff.lint]
extend-ignore = ["E741", "E722", "F401"]  # example: match your current settings

[tool.ruff.lint.isort]
known-third-party = ["pymedphys._imports"]
known-first-party = ["pymedphys"]


[tool.pyright]
include = ["lib/pymedphys"]
reportMissingImports = false
reportGeneralTypeIssues = false
reportUnboundVariable = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalCall = false
reportOptionalIterable = false
reportPrivateImportUsage = false
reportArgumentType = false
reportCallIssue = false
reportOperatorIssue = false
reportAttributeAccessIssue = false
reportAssignmentType = false
reportIndexIssue = false
reportReturnType = false
reportMissingModuleSource = false
reportTypedDictNotRequiredAccess = false

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"